name: Pages

# Publishes web/ to GitHub Pages. The repository variable API_BASE holds the URL of the deployed API.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Point the page at the API
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          test -n "$API_BASE" || { echo "Set the repository variable API_BASE to the API URL first."; exit 1; }
          printf 'window.API_BASE = "%s";\n' "$API_BASE" > web/config.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      # deploy-pages can look up the artifact before it is visible and fail with
      # "No artifacts named github-pages" (actions/deploy-pages#451), so it is retried after a pause.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.retry1.outcome == 'failure'
        run: sleep 60
      - id: retry2
        if: steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v5
