name: Pages

# Publishes web/ to GitHub Pages. The repository variable API_BASE holds the URL of the deployed API.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Point the page at the API
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          test -n "$API_BASE" || { echo "Set the repository variable API_BASE to the API URL first."; exit 1; }
          printf 'window.API_BASE = "%s";\n' "$API_BASE" > web/config.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
