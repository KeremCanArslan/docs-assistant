[project]
name = "docs-assistant"
version = "1.0.0"
description = "Answers questions from a company's own documents and cites the page it used."
requires-python = ">=3.12"
license = "MIT"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.pyright]
venvPath = "."
venv = ".venv"
