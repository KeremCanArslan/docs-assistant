# Render Blueprint: one free web service built from the Dockerfile in the repository root.
# The two API keys are entered in the Render dashboard when the Blueprint is created; they are not stored here.
services:
  - type: web
    name: docs-assistant
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GENERATORS
        value: openai,gemini
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_REASONING_EFFORT
        value: medium
      - key: REQUESTS_PER_MINUTE
        value: 6
      - key: DAILY_LIMIT
        value: 150
      - key: TRUST_PROXY
        value: 1
      - key: ALLOWED_ORIGINS
        value: https://keremcanarslan.github.io
